# NOT RUN yet: written without network or a GitHub runner. First push is the first real execution.
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q
      - name: Evaluation pipeline runs end-to-end (synthetic)
        run: PYTHONPATH=. python -m ml.evaluation.run_eval > /dev/null
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npm run build
